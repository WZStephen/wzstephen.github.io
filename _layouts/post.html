---
layout: default
---

<article class="wrap post">
  <header class="post-header">
    {% if page.categories contains 'personal-essay' %}
      <a class="back-link" href="{{ '/essays/' | relative_url }}">← 返回随笔归档</a>
    {% else %}
      <a class="back-link" href="{{ '/blog/' | relative_url }}">← 返回归档</a>
    {% endif %}
    <h1>{{ page.title }}</h1>
    <div class="post-meta">{{ page.date | date: "%Y-%m-%d" }}</div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>
</article>
