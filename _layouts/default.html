<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="shortcut icon" href="{{ '/Img_Files/icon_ailurus.ico' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap nav">
      <a class="brand" href="{{ '/' | relative_url }}">Weichi Zhao</a>
      <nav class="nav-links">
        <a href="{{ '/' | relative_url }}">首页</a>
        <a href="{{ '/blog/' | relative_url }}">AI 技术博客</a>
        <a href="{{ '/markets/' | relative_url }}">市场观察</a>
        <a href="{{ '/Files/CN_Resume_Weichi_Zhao.pdf' | relative_url }}">中文 PDF 简历</a>
        <a href="{{ '/Files/EN_Resume_Weichi_Zhao.pdf' | relative_url }}">English PDF</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>AI infrastructure, LLM serving, MaaS, and agent engineering notes.</span>
    </div>
  </footer>
</body>
</html>
